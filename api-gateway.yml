server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      routes:
        # 1. Authentication & User Management
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**, /users/**

        # 2. Problem Browsing & Management
        - id: problem-service
          uri: lb://PROBLEM-SERVICE
          predicates:
            - Path=/problems/**

        # 3. Code Submission & Verdict Tracking (Rate-Limited)
        - id: submission-service
          uri: lb://SUBMISSION-SERVICE
          predicates:
            - Path=/submissions/**
          filters:
            # Prevents users from spamming the code judge queue
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1    # Tokens added per second
                redis-rate-limiter.burstCapacity: 5    # Max bursts allowed in queue
                key-resolver: "#{@userKeyResolver}"    # Rate limits per authenticated User ID or IP

